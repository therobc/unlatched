# Builds the Windows release here, on GitHub's runners, and signs what it built
# so a stranger can check where the binary came from without taking our word
# for it. It mirrors packaging/build_release.py run locally - setup Rust and
# Python, install PyInstaller, run the script - with the test suite run first.
#
# WHY THIS EXISTS AT ALL, and it is not convenience. A SHA-256 published on the
# same page as the file it describes authenticates nothing: anyone standing up
# a lookalike release publishes their own binary and their own matching table.
# The hash is an integrity check, never an authenticity one. Build provenance
# is the part that cannot be imitated - the attestation names THIS repository,
# this workflow and this commit, and is recorded in a public transparency log,
# so `gh attestation verify --repo` gives an answer that does not come from us.
#
# NOTHING HERE IS EVER PUSHED FROM A DEVELOPMENT MACHINE. `app/` lives inside a
# much larger private tree, so every file reaches this repository through the
# web upload form and there is no git remote pointing here. That is why the
# trigger below is NOT `on: push: tags`, which is what this file used to say:
# a tag push was the one thing in it that assumed a git remote we do not have
# and must not have. Publishing a release through the web form creates its tag
# - that is how v0.1.2's tag came to exist - so the release event is the
# trigger, with a manual button for testing.

name: release

on:
  # The button on the Actions tab. This is how the workflow gets exercised
  # without cutting a release, which matters because a workflow's first run is
  # its first test and that should not happen in front of an audience.
  workflow_dispatch:
  # Publishing through the web form. Cut the release as a DRAFT, let this
  # attach the artifacts, then publish - so nobody ever sees a release with
  # nothing to download.
  release:
    types: [published]

# LEAST PRIVILEGE, STATED. Without this block the automatic GITHUB_TOKEN takes
# whatever the repository's default is, which on older repositories is write
# access to everything. GitHub's own hardening guidance is to default the token
# to read and raise it per job.
permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write # required to attach files to the GitHub Release
      # THE TWO THAT MAKE PROVENANCE POSSIBLE, and they are exactly as narrow
      # as they look. id-token mints the short-lived OIDC token that proves to
      # Sigstore which workflow is asking; attestations lets the result be
      # recorded against this repository. Neither grants access to code.
      id-token: write
      attestations: write
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      # THIRD-PARTY ACTIONS ARE PINNED TO A COMMIT, not to a tag or a branch.
      # A tag can be moved and a branch moves by definition, so either one
      # means running whatever that repository contains on the day the workflow
      # fires - which is how the tj-actions compromise reached thousands of
      # pipelines. A commit SHA is the only immutable reference GitHub offers.
      #
      # GitHub's own actions/* below stay on major version tags deliberately:
      # they come from the same place the runner does, and pinning them freezes
      # out their security updates too. Third-party code gets the stricter
      # treatment because that is where the risk actually is.
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Cache cargo registry and build output
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            desktop/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('desktop/Cargo.lock') }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install the Python package and build tools
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]"
          pip install pyinstaller

      # BEFORE anything is packaged. A tag that produces installers without
      # having run the suite hands strangers a build nothing checked, and the
      # suite is the only thing here that can say the engine still works.
      - name: Run the test suite
        run: python -m pytest tests/ -q

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Run the release build
        run: python packaging/build_release.py

      - name: List dist output
        run: Get-ChildItem -Recurse dist | Select-Object FullName, Length

      # SIGNED BEFORE THEY GO ANYWHERE. The attestation is over the bytes that
      # exist right now, in this job, so anything that touched them afterwards
      # would break verification rather than be quietly signed over.
      - name: Attest what was built
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/*.zip
            dist/Unlatched-Setup-*.exe

      - name: Print the SHA-256 of each artifact
        # SO THE LOG IS A WITNESS. The release notes carry these numbers and
        # they are written by a script on a developer machine; having the
        # runner state them independently means the two can be compared by
        # anybody reading the public log.
        run: Get-FileHash dist\*.zip, dist\Unlatched-Setup-*.exe -Algorithm SHA256 | Format-List Path, Hash

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: unlatched-windows-release
          path: |
            dist/*.zip
            dist/*.exe
          if-no-files-found: error

      # ONLY WHEN A RELEASE TRIGGERED THIS. On a manual run there is no release
      # to attach to, and a step that fails for that reason would make every
      # test run red for a reason that is not a fault.
      #
      # THE FROZEN-BINARY CHECK IS NOT HERE, and that is deliberate rather than
      # forgotten. It decompresses the built engine and searches inside it,
      # using scanning patterns that name the very things they look for - so
      # publishing that tool would publish the list. The artifact above is
      # downloaded and checked on a private machine before a release is
      # published. Two gates, both still run, one of them off this runner.
      - name: Attach artifacts to the GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            dist/*.zip
            dist/*.exe
