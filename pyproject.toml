[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "unlatched"
version = "0.1.1"
description = "Local-first job discovery: find roles on company career pages and ATS boards, screen them deterministically, and track your pipeline."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "Unlatched contributors" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
unlatched = "unlatched.cli:main"

[tool.setuptools.packages.find]
include = ["unlatched*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
